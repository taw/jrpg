[project]
name = "jrpg"
version = "0.1.0"
description = "A kanji learning game styled after classic SNES RPGs"
requires-python = ">=3.13,<3.14"

# Versions are pinned exactly. This is a preservation project: the goal is that
# `uv run` still produces a working game years from now, not that we track the
# latest releases.
dependencies = [
    "pygame==2.6.1",
    "appdirs==1.4.4",
]

[project.optional-dependencies]
# Only level_editor.py needs wx. The game itself does not.
editor = ["wxPython==4.2.5"]

[tool.uv]
package = false
